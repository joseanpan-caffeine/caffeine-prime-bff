name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.yaml
