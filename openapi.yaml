      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantThreadSchema"
      tags: *a19
      security: *a20
    delete:
      operationId: AssistantController_deleteThread
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      tags: *a19
      security: *a20
  /v1/me/assistant/messages:
    post:
      operationId: AssistantController_send
      summary: Envia uma mensagem (nova conversa quando threadId ausente)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantSendDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSendResponseSchema"
      tags: *a19
      security: *a20
info:
  title: Caffeine Prime BFF
  description: Backend-for-frontend do app Caffeine Army Prime. Contrato em
    src/contracts/api.ts.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AppConfigLinksSchema:
      type: object
      properties:
        privacy:
          type: string
        terms:
          type: string
        support:
          type: string
        subscribeUrl:
          type: string
        healthPrivacy:
          type: string
      required:
        - privacy
        - terms
        - support
        - subscribeUrl
    AppConfigSchema:
      type: object
      properties:
        minSupportedVersion:
          type: string
        features:
          type: object
          additionalProperties:
            type: boolean
        links:
          $ref: "#/components/schemas/AppConfigLinksSchema"
        consentVersions:
          type: object
          additionalProperties:
            type: string
          description: Versões vigentes dos termos de consentimento por tipo
      required:
        - minSupportedVersion
        - features
        - links
        - consentVersions
    UserProfileSchema:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        cpf:
          type: string
          example: "***.***.123-45"
        phone:
          type: string
        gender:
          type: string
        hasSubscription:
          type: boolean
      required:
        - id
        - email
        - firstName
        - lastName
        - hasSubscription
    AuthResponseSchema:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
          example: 900
        user:
          $ref: "#/components/schemas/UserProfileSchema"
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: ativa@teste.com
        password:
          type: string
          example: prime123
        deviceName:
          type: string
          example: iPhone de Mariana
      required:
        - email
        - password
    SocialLoginDto:
      type: object
      properties:
        idToken:
          type: string
          description: "id_token (Google) ou identityToken (Apple). Fake: `fake:<email>`"
        fullName:
          type: string
        deviceName:
          type: string
      required:
        - idToken
    MagicLinkDto:
      type: object
      properties:
        email:
          type: string
          example: ativa@teste.com
      required:
        - email
    MagicLinkExchangeDto:
      type: object
      properties:
        token:
          type: string
        deviceName:
          type: string
      required:
        - token
    RegisterDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        cpf:
          type: string
          example: 123.456.789-01
        phone:
          type: string
          example: "+5511999999999"
        birthDate:
          type: string
          example: 1990-05-20
      required:
        - firstName
        - lastName
        - email
        - password
        - cpf
        - phone
        - birthDate
    AuthTokensSchema:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
          example: 900
      required:
        - accessToken
        - refreshToken
        - expiresIn
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UpdateProfileDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        gender:
          type: string
    MoneySchema:
      type: object
      properties:
        amount:
          type: number
          example: 144.9
        currency:
          type: string
          enum:
            - BRL
      required:
        - amount
        - currency
    ProductItemSchema:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        flavor:
          type: string
        imageUrl:
          type: string
        sku:
          type: string
        quantity:
          type: number
        price:
          $ref: "#/components/schemas/MoneySchema"
        discountPercentage:
          type: number
        finalPrice:
          $ref: "#/components/schemas/MoneySchema"
        recurrence:
          type: string
          enum:
            - on
            - off
          nullable: true
        cyclesLeft:
          type: number
        isGift:
          type: boolean
      required:
        - id
        - handle
        - title
        - quantity
        - price
        - discountPercentage
        - finalPrice
        - recurrence
    DiscountSchema:
      type: object
      properties:
        code:
          type: string
        percentage:
          type: number
        temporaryCode:
          type: string
        temporaryPercentage:
          type: number
        temporaryCycles:
          type: number
      required:
        - percentage
    PaymentProfileSchema:
      type: object
      properties:
        id:
          type: string
        brand:
          type: string
          example: Visa
        lastFour:
          type: string
          example: "4242"
        holderName:
          type: string
        expiration:
          type: string
          example: 08/2029
        isDefault:
          type: boolean
      required:
        - id
        - brand
        - lastFour
        - holderName
        - expiration
        - isDefault
    ShippingAddressSchema:
      type: object
      properties:
        id:
          type: string
        recipient:
          type: string
        postalCode:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        deliveryMethod:
          type: string
        deliveryEstimateDays:
          type: number
      required:
        - id
        - recipient
        - postalCode
        - street
        - number
        - neighborhood
        - city
        - state
    SubscriptionPauseSchema:
      type: object
      properties:
        cycles:
          type: number
        remainingCycles:
          type: number
        pausedAt:
          type: string
        resumeAt:
          type: string
        pauseType:
          type: string
          enum:
            - User
            - Offer
          description: Offer = pausa de retenção
      required:
        - cycles
        - remainingCycles
        - pausedAt
        - resumeAt
    ScheduledChangeSchema:
      type: object
      properties:
        id:
          type: string
        appliesAt:
          type: string
        frequency:
          type: string
          enum:
            - Mensal
            - Trimestral
            - Semestral
            - Anual
        planName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductItemSchema"
        total:
          $ref: "#/components/schemas/MoneySchema"
        nextCycleOnly:
          type: boolean
      required:
        - id
        - appliesAt
        - frequency
        - planName
        - items
        - total
        - nextCycleOnly
    SubscriptionSchema:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - active
            - future
            - paused
            - canceled
            - fraud_review
        rawStatus:
          type: string
          description: Status original quando fora do enum conhecido
        frequency:
          type: string
          enum:
            - Mensal
            - Trimestral
            - Semestral
            - Anual
        planName:
          type: string
        startedAt:
          type: string
        nextBillingAt:
          type: string
        currentCycle:
          type: number
        paidCycles:
          type: number
        remainingCommitmentMonths:
          type: number
          description: -1 para Mensal
        pauseCreditsLeft:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductItemSchema"
        discount:
          $ref: "#/components/schemas/DiscountSchema"
        paymentProfile:
          $ref: "#/components/schemas/PaymentProfileSchema"
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddressSchema"
        pause:
          $ref: "#/components/schemas/SubscriptionPauseSchema"
        scheduledChange:
          $ref: "#/components/schemas/ScheduledChangeSchema"
        subtotal:
          $ref: "#/components/schemas/MoneySchema"
        totalDiscount:
          $ref: "#/components/schemas/MoneySchema"
        total:
          $ref: "#/components/schemas/MoneySchema"
      required:
        - id
        - status
        - frequency
        - planName
        - startedAt
        - nextBillingAt
        - currentCycle
        - paidCycles
        - remainingCommitmentMonths
        - pauseCreditsLeft
        - items
        - discount
        - subtotal
        - totalDiscount
        - total
    LastCanceledSchema:
      type: object
      properties:
        canceledAt:
          type: string
        reason:
          type: string
        subscriptionId:
          type: string
      required:
        - canceledAt
        - subscriptionId
    CapabilitySchema:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: &a21
            - EDIT_WINDOW_CLOSED
            - SUBSCRIPTION_NOT_ACTIVE
            - FREQUENCY_NOT_ELIGIBLE
            - NO_PAUSE_CREDITS
            - MIN_PAID_CYCLES
            - PAUSE_WINDOW_CLOSED
            - RESUME_WINDOW_CLOSED
            - PENDING_BILL
            - NOT_PAUSED
            - NOT_CANCELED
            - CANCELLATION_BLOCKED
            - COMMITMENT_ACTIVE
            - CANCEL_WINDOW_CLOSED
            - UNDER_REVIEW
        until:
          type: string
          description: Quando reabre (ISO, São Paulo)
        closesAt:
          type: string
          description: Quando a ação deixa de ser permitida (ISO, São Paulo)
      required:
        - allowed
    PauseCapabilitySchema:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: *a21
        until:
          type: string
          description: Quando reabre (ISO, São Paulo)
        closesAt:
          type: string
          description: Quando a ação deixa de ser permitida (ISO, São Paulo)
        creditsLeft:
          type: number
        maxCycles:
          type: number
      required:
        - allowed
    CancelCapabilitySchema:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: *a21
        until:
          type: string
          description: Quando reabre (ISO, São Paulo)
        closesAt:
          type: string
          description: Quando a ação deixa de ser permitida (ISO, São Paulo)
        remainingCommitmentMonths:
          type: number
        earlyWindow:
          type: boolean
        commitmentEndsAt:
          type: string
          description: Estimativa ISO do fim da fidelidade
      required:
        - allowed
    PendingBillSchema:
      type: object
      properties:
        id:
          type: string
        amount:
          $ref: "#/components/schemas/MoneySchema"
        dueAt:
          type: string
        pixAvailable:
          type: boolean
      required:
        - id
        - amount
        - dueAt
        - pixAvailable
    CapabilitiesSchema:
      type: object
      properties:
        canEdit:
          $ref: "#/components/schemas/CapabilitySchema"
        canPause:
          $ref: "#/components/schemas/PauseCapabilitySchema"
        canResume:
          $ref: "#/components/schemas/CapabilitySchema"
        canCancel:
          $ref: "#/components/schemas/CancelCapabilitySchema"
        canReactivate:
          $ref: "#/components/schemas/CapabilitySchema"
        canChangeCard:
          $ref: "#/components/schemas/CapabilitySchema"
        canChangeAddress:
          $ref: "#/components/schemas/CapabilitySchema"
        hasPendingBill:
          type: boolean
        pendingBill:
          $ref: "#/components/schemas/PendingBillSchema"
      required:
        - canEdit
        - canPause
        - canResume
        - canCancel
        - canReactivate
        - canChangeCard
        - canChangeAddress
        - hasPendingBill
    PixChargeSchema:
      type: object
      properties:
        qrCodeImageUrl:
          type: string
        qrCodeText:
          type: string
        expiresAt:
          type: string
      required:
        - qrCodeImageUrl
        - qrCodeText
        - expiresAt
    TrackingEventSchema:
      type: object
      properties:
        status:
          type: string
        description:
          type: string
        occurredAt:
          type: string
        location:
          type: string
      required:
        - status
        - description
        - occurredAt
    FulfillmentSchema:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - in_transit
            - out_for_delivery
            - delivered
            - failed
        carrier:
          type: string
        trackingCode:
          type: string
        trackingUrl:
          type: string
        estimatedDeliveryAt:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEventSchema"
      required:
        - status
        - events
    BillSchema:
      type: object
      properties:
        id:
          type: string
        cycle:
          type: number
        status:
          type: string
          enum:
            - pending
            - paid
            - canceled
            - review
        issuedAt:
          type: string
        dueAt:
          type: string
        paidAt:
          type: string
        amount:
          $ref: "#/components/schemas/MoneySchema"
        paymentMethod:
          type: string
          enum:
            - credit_card
            - pix
        paymentProfile:
          $ref: "#/components/schemas/PaymentProfileSchema"
        pix:
          $ref: "#/components/schemas/PixChargeSchema"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductItemSchema"
        fulfillment:
          $ref: "#/components/schemas/FulfillmentSchema"
        pausedCycle:
          type: boolean
          description: Fatura R$ 0,00 de ciclo pausado (esperado, não erro)
      required:
        - id
        - cycle
        - status
        - issuedAt
        - dueAt
        - amount
        - items
    SavingsSchema:
      type: object
      properties:
        last12Months:
          $ref: "#/components/schemas/MoneySchema"
        sinceStart:
          $ref: "#/components/schemas/MoneySchema"
      required:
        - last12Months
        - sinceStart
    WalletSchema:
      type: object
      properties:
        points:
          type: number
        label:
          type: string
      required:
        - points
        - label
    BannerSchema:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        imageUrl:
          type: string
        deepLink:
          type: string
      required:
        - id
        - title
    DashboardSchema:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfileSchema"
        subscription:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SubscriptionSchema"
        lastCanceled:
          $ref: "#/components/schemas/LastCanceledSchema"
        capabilities:
          $ref: "#/components/schemas/CapabilitiesSchema"
        latestBill:
          $ref: "#/components/schemas/BillSchema"
        tracking:
          $ref: "#/components/schemas/FulfillmentSchema"
        savings:
          $ref: "#/components/schemas/SavingsSchema"
        wallet:
          $ref: "#/components/schemas/WalletSchema"
        banners:
          type: array
          items:
            $ref: "#/components/schemas/BannerSchema"
      required:
        - user
        - subscription
        - capabilities
        - savings
        - wallet
        - banners
    DeleteRequestDto:
      type: object
      properties:
        reason:
          type: string
    PlanSchema:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - Mensal
            - Trimestral
            - Semestral
            - Anual
        name:
          type: string
        commitmentMonths:
          type: number
        discountPercentage:
          type: number
        pauseCredits:
          type: number
        highlight:
          type: string
      required:
        - frequency
        - name
        - commitmentMonths
        - discountPercentage
        - pauseCredits
    FlavorSchema:
      type: object
      properties:
        handle:
          type: string
        title:
          type: string
        inStock:
          type: boolean
      required:
        - handle
        - title
        - inStock
    CatalogProductSchema:
      type: object
      properties:
        handle:
          type: string
        title:
          type: string
        category:
          type: string
        imageUrl:
          type: string
        price:
          $ref: "#/components/schemas/MoneySchema"
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/FlavorSchema"
        inStock:
          type: boolean
        minQuantity:
          type: number
        maxQuantity:
          type: number
        usageHint:
          type: string
          description: Para que serve / como tomar
        dosesPerUnit:
          type: number
          description: Doses por unidade (previsão de estoque)
      required:
        - handle
        - title
        - category
        - price
        - inStock
        - minQuantity
        - maxQuantity
    DiscountTierSchema:
      type: object
      properties:
        minItems:
          type: number
        discountPercentage:
          type: number
        label:
          type: string
      required:
        - minItems
        - discountPercentage
        - label
    GiftSchema:
      type: object
      properties:
        handle:
          type: string
        title:
          type: string
        imageUrl:
          type: string
        requiresPlan:
          type: array
          items:
            type: string
      required:
        - handle
        - title
    CatalogSchema:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanSchema"
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProductSchema"
        discountTiers:
          type: array
          items:
            $ref: "#/components/schemas/DiscountTierSchema"
        gifts:
          type: array
          items:
            $ref: "#/components/schemas/GiftSchema"
      required:
        - plans
        - products
        - discountTiers
        - gifts
    PricePreviewItemSchema:
      type: object
      properties:
        handle:
          type: string
        quantity:
          type: number
        recurrence:
          type: string
          enum:
            - on
            - off
          nullable: true
        title:
          type: string
        unitPrice:
          $ref: "#/components/schemas/MoneySchema"
        discountPercentage:
          type: number
        finalUnitPrice:
          $ref: "#/components/schemas/MoneySchema"
      required:
        - handle
        - quantity
        - title
        - unitPrice
        - discountPercentage
        - finalUnitPrice
    PricePreviewSchema:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - Mensal
            - Trimestral
            - Semestral
            - Anual
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricePreviewItemSchema"
        subtotal:
          $ref: "#/components/schemas/MoneySchema"
        totalDiscount:
          $ref: "#/components/schemas/MoneySchema"
        total:
          $ref: "#/components/schemas/MoneySchema"
        appliedDiscountPercentage:
          type: number
        couponApplied:
          type: string
        warnings:
          type: array
          items:
            type: string
      required:
        - frequency
        - items
        - subtotal
        - totalDiscount
        - total
        - appliedDiscountPercentage
        - warnings
    BoxItemInputDto:
      type: object
      properties:
        handle:
          type: string
          example: supercoffee-3-0-original-380g
        quantity:
          type: number
          example: 2
        recurrence:
          type: string
          enum:
            - on
            - off
          nullable: true
          description: null = todo ciclo
      required:
        - handle
        - quantity
    PreviewDto:
      type: object
      properties:
        frequency:
          type: string
          enum: &a22
            - Mensal
            - Trimestral
            - Semestral
            - Anual
        items:
          type: array
          items:
            $ref: "#/components/schemas/BoxItemInputDto"
        couponCode:
          type: string
          example: PRIME10
      required:
        - frequency
        - items
    SchedulingDto:
      type: object
      properties:
        frequency:
          type: string
          enum: *a22
        items:
          type: array
          items:
            $ref: "#/components/schemas/BoxItemInputDto"
        couponCode:
          type: string
          example: PRIME10
        giftHandles:
          type: array
          items:
            type: string
        nextCycleOnly:
          type: boolean
        reason:
          type: string
      required:
        - frequency
        - items
    RecurrenceDto:
      type: object
      properties:
        recurrence:
          type: string
          enum:
            - on
            - off
          nullable: true
      required:
        - recurrence
    DiscountDto:
      type: object
      properties:
        code:
          type: string
          example: PRIME10
      required:
        - code
    AnswerDto:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
      required:
        - question
        - answer
    PauseDto:
      type: object
      properties:
        cycles:
          type: number
          example: 1
          minimum: 1
          maximum: 2
        reason:
          type: string
          example: stock
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerDto"
      required:
        - cycles
        - reason
    CancelDto:
      type: object
      properties:
        reason:
          type: string
          example: price
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerDto"
      required:
        - reason
    FollowUpSchema:
      type: object
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
      required:
        - question
        - options
    ReasonOptionSchema:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        followUp:
          $ref: "#/components/schemas/FollowUpSchema"
      required:
        - code
        - label
    VindiConfigSchema:
      type: object
      properties:
        publicKey:
          type: string
        apiUrl:
          type: string
        sandbox:
          type: boolean
      required:
        - publicKey
        - apiUrl
        - sandbox
    AddCardDto:
      type: object
      properties:
        gatewayToken:
          type: string
          example: tok_visa_4242
        paymentCompanyCode:
          type: string
          example: visa
        setAsDefault:
          type: boolean
      required:
        - gatewayToken
    PayWithNewCardDto:
      type: object
      properties:
        gatewayToken:
          type: string
          example: tok_mastercard_5555
        paymentCompanyCode:
          type: string
      required:
        - gatewayToken
    AddressQuoteOptionSchema:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        carrier:
          type: string
        estimateDays:
          type: number
        price:
          $ref: "#/components/schemas/MoneySchema"
