info:
  title: Caffeine Prime BFF
  description: Backend-for-frontend do app Caffeine Army Prime. Contrato em
    src/contracts/api.ts.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AppConfigLinksSchema:
      type: object
      properties:
        privacy:
          type: string
        terms:
          type: string
        support:
          type: string
        subscribeUrl:
          type: string
      required:
        - privacy
        - terms
        - support
        - subscribeUrl
    AppConfigSchema:
      type: object
      properties:
        minSupportedVersion:
          type: string
        features:
          type: object
          additionalProperties:
            type: boolean
        links:
          $ref: "#/components/schemas/AppConfigLinksSchema"
      required:
        - minSupportedVersion
        - features
        - links
    UserProfileSchema:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        cpf:
          type: string
          example: "***.***.123-45"
        phone:
          type: string
        gender:
          type: string
        hasSubscription:
          type: boolean
      required:
        - id
        - email
        - firstName
        - lastName
        - hasSubscription
    AuthResponseSchema:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
          example: 900
        user:
          $ref: "#/components/schemas/UserProfileSchema"
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: ativa@teste.com
        password:
          type: string
          example: prime123
        deviceName:
          type: string
          example: iPhone de Mariana
      required:
        - email
        - password
    SocialLoginDto:
      type: object
      properties:
        idToken:
          type: string
          description: "id_token (Google) ou identityToken (Apple). Fake: `fake:<email>`"
        fullName:
          type: string
        deviceName:
          type: string
      required:
        - idToken
    MagicLinkDto:
      type: object
      properties:
        email:
          type: string
          example: ativa@teste.com
      required:
        - email
    MagicLinkExchangeDto:
      type: object
      properties:
        token:
          type: string
        deviceName:
          type: string
      required:
        - token
    RegisterDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        cpf:
          type: string
          example: 123.456.789-01
        phone:
          type: string
          example: "+5511999999999"
        birthDate:
          type: string
          example: 1990-05-20
      required:
        - firstName
        - lastName
        - email
        - password
        - cpf
        - phone
        - birthDate
    AuthTokensSchema:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
          example: 900
      required:
        - accessToken
        - refreshToken
        - expiresIn
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UpdateProfileDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        gender:
          type: string
    MoneySchema:
      type: object
      properties:
        amount:
          type: number
          example: 144.9
        currency:
          type: string
          enum:
            - BRL
      required:
        - amount
        - currency
    ProductItemSchema:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        flavor:
          type: string
        imageUrl:
          type: string
        sku:
          type: string
        quantity:
          type: number
        price:
          $ref: "#/components/schemas/MoneySchema"
        discountPercentage:
          type: number
        finalPrice:
          $ref: "#/components/schemas/MoneySchema"
        recurrence:
          type: string
          enum:
            - on
            - off
          nullable: true
        cyclesLeft:
          type: number
        isGift:
          type: boolean
      required:
        - id
        - handle
        - title
        - quantity
        - price
        - discountPercentage
        - finalPrice
        - recurrence
    DiscountSchema:
      type: object
      properties:
        code:
          type: string
        percentage:
          type: number
        temporaryCode:
          type: string
        temporaryPercentage:
          type: number
        temporaryCycles:
          type: number
      required:
        - percentage
